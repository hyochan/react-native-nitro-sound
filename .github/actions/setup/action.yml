name: Setup
description: Setup the repository-pinned Node.js and Yarn toolchain

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: 'yarn'

    - name: Enable Corepack
      shell: bash
      run: |
        corepack enable
        yarn --version
